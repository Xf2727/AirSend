name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  workflow-check:
    name: Workflow and script checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Normalize script permissions
        run: |
          chmod +x build_magisk_payload.sh
          chmod +x magisk_module/service.sh
          chmod +x tools/test_airsend_version_alignment.sh

      - name: Parse workflow YAML
        run: |
          ruby -e "require 'yaml'; YAML.load_file('.github/workflows/ci.yml'); puts 'workflow yaml parsed'"

      - name: Check shell scripts parse
        run: |
          bash -n build_magisk_payload.sh
          bash -n magisk_module/service.sh
          bash -n tools/test_airsend_version_alignment.sh

      - name: Check required project files
        run: |
          test -f Android/settings.gradle.kts
          test -f Android/build.gradle.kts
          test -f Android/app/build.gradle.kts
          test -f Android/airsend_daemon/Cargo.toml
          test -f Android/patches/localsend/Cargo.toml
          test -x Android/gradlew
          test -x tools/test_airsend_version_alignment.sh

      - name: Test AirSend version alignment
        run: tools/test_airsend_version_alignment.sh

  rust-daemon:
    name: Rust daemon and patched LocalSend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: workflow-check
    steps:
      - uses: actions/checkout@v4

      - name: Show Rust version
        run: rustc --version && cargo --version

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            Android/airsend_daemon/target
            Android/patches/localsend/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Android/airsend_daemon/Cargo.lock', 'Android/patches/localsend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check patched LocalSend
        working-directory: Android/patches/localsend
        run: cargo check --locked

      - name: Clippy patched LocalSend
        working-directory: Android/patches/localsend
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test daemon
        working-directory: Android/airsend_daemon
        run: cargo test --locked

      - name: Clippy daemon
        working-directory: Android/airsend_daemon
        run: cargo clippy --locked --all-targets -- -D warnings

  android:
    name: Android daemon, lint, tests, and assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: workflow-check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: 27.2.12479018

      - name: Install Rust Android target and cargo-ndk
        shell: bash
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Show Gradle and Android tool versions
        working-directory: Android
        run: ./gradlew --version

      - name: Build Android Rust daemon from source
        working-directory: Android/airsend_daemon
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          cargo ndk -t aarch64-linux-android -o /tmp/airsend-daemon build --release --locked
          test -x /tmp/airsend-daemon/arm64-v8a/airsend_daemon
          cp /tmp/airsend-daemon/arm64-v8a/airsend_daemon ../app/src/main/assets/airsend_daemon
          chmod +x ../app/src/main/assets/airsend_daemon

      - name: Upload Android Rust daemon
        uses: actions/upload-artifact@v4
        with:
          name: AirSend-Android-daemon-arm64
          path: Android/app/src/main/assets/airsend_daemon
          if-no-files-found: error
          retention-days: 14

      - name: Run Android lint
        working-directory: Android
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace

      - name: Run Android unit tests
        working-directory: Android
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble debug APK
        working-directory: Android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AirSend-Android-debug-apk
          path: Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
