name: Windows client

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore Windows/AirSend.Windows.csproj
      - name: Build
        run: dotnet build Windows/AirSend.Windows.csproj --configuration Release --no-restore
      - name: Publish Windows app
        run: dotnet publish Windows/AirSend.Windows.csproj --configuration Release --runtime win-x64 --self-contained true --output Windows/publish
      - name: Package Windows app
        shell: pwsh
        run: Compress-Archive -Path Windows/publish/* -DestinationPath AirSend-Windows-win-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: AirSend-Windows-win-x64
          path: AirSend-Windows-win-x64.zip
          if-no-files-found: error
